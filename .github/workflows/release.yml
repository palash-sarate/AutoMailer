name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'AutoMailer Pro Release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine Tag & Version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_RAW="${{ github.event.inputs.release_tag }}"
            echo "tag=${TAG_RAW}" >> $GITHUB_OUTPUT
            echo "version=${TAG_RAW#v}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT
            echo "title=AutoMailer Pro ${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.head_commit.message }}" == *"[release]"* ]]; then
            COMMIT_TAG="v1.0.$(date +'%Y%m%d%H%M')"
            echo "tag=${COMMIT_TAG}" >> $GITHUB_OUTPUT
            echo "version=${COMMIT_TAG#v}" >> $GITHUB_OUTPUT
            echo "title=AutoMailer Pro ${COMMIT_TAG}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Inject Version from Git Tag
        if: steps.vars.outputs.is_release == 'true'
        shell: bash
        run: |
          python -c "
          import re
          ver = '${{ steps.vars.outputs.version }}'
          with open('updater_service.py', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'APP_VERSION\s*=\s*[\"\\\'].*?[\"\\\']', f'APP_VERSION = \"{ver}\"', content)
          with open('updater_service.py', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Successfully injected version v{ver} into updater_service.py')
          "

      - name: Run Unit Tests
        run: |
          python test_app.py

      - name: Build Portable Executable
        run: |
          python build_exe.py

      - name: Package Release Zip
        run: |
          Compress-Archive -Path dist\AutoMailer_Portable\* -DestinationPath dist\AutoMailer_Portable_Windows.zip

      - name: Create GitHub Release
        if: steps.vars.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/AutoMailer_Portable_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        if: steps.vars.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoMailer_Portable_Windows
          path: dist/AutoMailer_Portable_Windows.zip
